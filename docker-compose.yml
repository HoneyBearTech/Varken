# Varken on its own, serving Prometheus metrics. Point your Prometheus at it (Argus, for example, runs Varken in
# its own stack); Grafana then reads the data from Prometheus.
#
#   cp .env.example .env     # then fill in the services you use (docs/configuration.md lists every setting)
#   mkdir -p config && sudo chown 1000:1000 config
#   docker compose up -d
name: varken

services:
  varken:
    image: ghcr.io/honeybeartech/varken:${VARKEN_VERSION:-latest}
    # The image runs as 1000:1000; the config folder must belong to the same uid/gid.
    user: "${VARKEN_UID:-1000}:${VARKEN_GID:-1000}"
    # Every VRKN_* setting in .env overrides the same key in varken.ini.
    env_file: .env
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      # varken.ini, the GeoLite2 database and logs/.
      - ${VARKEN_CONFIG_DIR:-./config}:/config
    ports:
      # /metrics, for a Prometheus on this host. The endpoint has no authentication: publish it only on a loopback
      # or private address, or leave this out when Prometheus shares the container's Docker network.
      - "${VARKEN_METRICS_BIND:-127.0.0.1:9180}:9180"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
