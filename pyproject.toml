# Settings for the repo's Python tooling. Varken runs from a checkout (Varken.py + the varken/ package) and
# isn't published to PyPI; this file only configures ruff, pytest and coverage. Tools are pinned with hashes
# in requirements-dev.txt.

[tool.ruff]
line-length = 120
target-version = "py315"

[tool.ruff.format]
# The code base uses single quotes; keep them so the formatting commit stays small.
quote-style = "single"

[tool.ruff.lint]
# Every rule family, minus the few that conflict with the formatter, with each other or with how Varken works.
# Exceptions in the code are made per line, with a reason. A new ruff release can add rules to "ALL": the pull
# request that bumps ruff then fixes what they find.
# An import that only annotations use goes in an `if TYPE_CHECKING:` block. ruff's own fix for TC001 and TC002 is a
# `lazy` import, which is a syntax error on the Python the fuzzer still runs on (tests/test_fuzz_python.py).
select = ["ALL"]
ignore = [
    "COM812", # conflicts with ruff format
    "CPY001", # files carry SPDX lines instead, which tests/test_licensing.py checks
    "D203",   # conflicts with D211 (no blank line before a class docstring)
    "D213",   # conflicts with D212 (summary on the first docstring line)
    "TRY400", # an error is logged as one line: a traceback's text isn't redacted by BlacklistFilter
]

[tool.ruff.lint.flake8-quotes]
# As ruff format writes them.
inline-quotes = "single"

[tool.ruff.lint.per-file-ignores]
"varken/structures.py" = [
    "N815", # the fields of the reply structures are the services' own JSON keys
]
"dashboard/**" = [
    "INP001", # a standalone command, not a package
    "T201",   # print() is how the command reports
]
"fuzz/**" = ["INP001"] # a standalone command, not a package
"tests/**" = [
    "ARG",     # stand-ins keep the signature of what they replace
    "D",       # test names say what they test
    "INP001",  # tests/ is not a package
    "PLR2004", # expected values are written inline
    "S101",    # pytest uses assert
    "S105",    # fixtures use placeholder credentials
    "S106",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-config", "--strict-markers", "-ra"]
# Any warning is a failure.
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["varken"]

[tool.coverage.report]
# The floor is the current figure; it rises toward 80 % (the roadmap), never down.
fail_under = 80
show_missing = true
skip_covered = true
