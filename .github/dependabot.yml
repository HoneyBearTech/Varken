version: 2
# Update PRs are reviewed and merged by hand once the required checks pass; nothing is auto-merged.
updates:
  # The base image in the Dockerfile (version tag and digest).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees: ["HoneyBearTech"]

  # The InfluxDB and Grafana images in the example docker-compose.yml.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees: ["HoneyBearTech"]

  # Runtime (requirements.txt) and the check and test tools (requirements-dev.txt), pinned with hashes.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees: ["HoneyBearTech"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees: ["HoneyBearTech"]
    groups:
      codeql:
        patterns:
          - "github/codeql-action*"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
